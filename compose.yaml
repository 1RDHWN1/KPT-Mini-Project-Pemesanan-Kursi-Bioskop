services:
  server:
    build: .
    command: python server.py
    ports:
      - "50051:50051"
    restart: unless-stopped

  web:
    build: .
    command: uvicorn gateway:app --host 0.0.0.0 --port 8000
    environment:
      GRPC_TARGET: server:50051
    ports:
      - "8000:8000"
    depends_on:
      - server
    restart: unless-stopped
